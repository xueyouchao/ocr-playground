# Static host for the playground. Copy index.html and assets/ next to it.
server {
    listen 80;
    server_name ocr-playground.example.com;

    root /var/www/ocr-playground;
    index index.html;

    # the page is rebuilt often; never serve a stale one
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # page renders never change for a given build
    location /assets/pages/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
